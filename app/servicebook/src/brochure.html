<meta charset="utf-8">
<title>Merci Momong Brochure</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"Pretendard";src:url(data:font/woff2;base64,__FONT__) format("woff2");font-weight:45 920;font-style:normal;font-display:swap}
/* Layout: 모바일 룩북. 흰 종이 페이지가 회색 책상 위에 쌓인다. 얇고 촘촘한 대문자 헤드라인, 작은 양쪽 정렬 본문,
   테두리 알약 라벨, 얇은 선 목록, 넉넉한 여백과 비대칭 배치. 사진 자리는 시술별 '헤어 스터디' 판화. 단일 라이트 테마(인쇄물 톤). */
:root{
  --desk:#9C9C9A; --paper:#F8F6F1; --plate:#EAE6DF; --ink:#141414; --body:#2E2E2E; --sub:#5C5C5A; --mute:#A3A3A0; --line:#D9D9D6;
  --sans:"Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:var(--sans);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--desk);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:linear-gradient(180deg,#A6A6A4,#959593) fixed var(--desk);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;letter-spacing:-0.015em;-webkit-font-smoothing:antialiased;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:14px 100px;font-variant-numeric:tabular-nums}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.book{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.pg{background:var(--paper);box-shadow:0 30px 50px -30px rgba(0,0,0,.55),0 2px 4px rgba(0,0,0,.08);padding:20px 22px 28px;position:relative;scroll-margin-top:62px;overflow:hidden;display:flex;flex-direction:column}
.pg.tall{min-height:min(148vw,800px)}
.pg.dark{background:#111111;color:#F1F1EF}
.pg.bleed{padding:0;aspect-ratio:3/4}
.pg.bleed .plate{position:absolute;inset:0;border-radius:0}
.run{display:flex;justify-content:space-between;font-size:11px;font-weight:500;letter-spacing:0;color:#2A2A2A;margin-bottom:34px}
.dark .run{color:#BDBDBA}
.bleed .run{position:absolute;left:22px;right:22px;top:20px;z-index:1;margin:0}
.grow{flex:1}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
.disp{font-size:clamp(38px,11.6vw,60px);line-height:.9;letter-spacing:-0.06em;font-weight:560;text-transform:uppercase}
.h2{font-size:clamp(28px,8.4vw,40px);line-height:.92;letter-spacing:-0.05em;font-weight:560;text-transform:uppercase}
.h3{font-size:clamp(18px,5.4vw,24px);line-height:.95;letter-spacing:-0.045em;font-weight:560;text-transform:uppercase}
p{margin:0}
.sm{font-size:13.5px;line-height:1.7;color:var(--body);text-align:left;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:-0.01em}
.dark .sm{color:#BDBDBA}
.xs{font-size:12px;line-height:1.45;color:var(--body);font-weight:500}
.dark .xs{color:#BDBDBA}
.two{columns:1}
.pill{display:inline-flex;align-items:center;justify-content:center;height:26px;padding:0 14px;border:1px solid currentColor;border-radius:13px;font-size:11.5px;font-weight:500;white-space:nowrap}
.plate{background:var(--plate);position:relative;overflow:hidden}
.plate canvas,.plate img{display:block;width:100%;height:100%;object-fit:cover}
.plate .cap{position:absolute;left:10px;bottom:9px;font-size:10.5px;font-weight:500;color:#5E5E5C;background:rgba(236,236,234,.92);padding:2px 6px}
.dark .plate{background:#1C1C1C}
.dark .plate .cap{color:#A9A9A6;background:rgba(28,28,28,.92)}

/* collage (무드보드: 겹쳐 놓은 사진 몇 장 + 아주 작은 글) */
.cl{position:relative;aspect-ratio:3/4.3;margin:4px -6px 0}
.cl img{position:absolute;display:block;aspect-ratio:3/4;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 18px 30px -22px rgba(0,0,0,.45)}
.cl-a .c1{left:44%;top:0;width:52%}
.cl-a .c2{left:24%;top:31%;width:32%;z-index:2}
.cl-a .c3{left:2%;top:45%;width:38%;z-index:1}
.cl-a .c4{left:52%;top:66%;width:32%}
.cl-b .c1{left:3%;top:2%;width:46%}
.cl-b .c2{left:66%;top:16%;width:17%}
.cl-b .c3{left:54%;top:34%;width:42%;z-index:1}
.cl-b .c4{left:22%;top:60%;width:42%;z-index:2}
.cl-foot{display:flex;justify-content:space-between;gap:12px;margin-top:auto;padding-top:18px;font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--body)}

/* cover */
.cover-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:11.5px;line-height:1.35;font-weight:500;margin-bottom:auto}
.cover-meta span:last-child{text-align:right}
.cover h1{margin:44px 0 18px}
.cover-img{margin:0 -22px}
.cover .plate{aspect-ratio:4/5}
.cover-foot{display:flex;justify-content:space-between;gap:12px;margin-top:12px}

/* statement */
.st-row{display:grid;grid-template-columns:24% minmax(0,1fr);gap:14px;align-items:start;margin-top:26px}
.st-row > .pill{justify-self:start}
.st-bottom{display:grid;grid-template-columns:30% minmax(0,1fr);gap:14px;align-items:end;margin-top:auto;padding-top:40px}
.st-bottom .plate{aspect-ratio:5/3}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:26px}
.trio figure{margin:0;display:flex;flex-direction:column;gap:6px}
.trio .plate{aspect-ratio:3/4}
.trio b{font-weight:600}

/* rules list (Design Principles) */
.rules{display:flex;flex-direction:column}
.rules > .pill{align-self:flex-start;margin-bottom:8px;min-width:58%}
.rules .r{font-size:13px;font-weight:500;padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.dark .rules .r{border-bottom-color:#2F2F2F}
.rules .r span:last-child{color:var(--sub);font-weight:400}

/* contents */
.toc{display:flex;flex-direction:column;margin-top:auto;padding-top:24px}
.toc a{text-decoration:none;display:grid;grid-template-columns:46px 30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;min-height:48px;border-bottom:1px solid var(--line)}
.toc .plate{width:46px;height:46px}
.toc a:first-child{border-top:1px solid var(--ink)}
.toc .n{font-size:12px;font-weight:500}
.toc .tt{font-size:clamp(17px,5vw,21px);font-weight:500;letter-spacing:-0.05em;text-transform:uppercase;line-height:1}
.toc .k{font-size:13px;color:var(--sub);font-weight:500}

/* favorite */
.fav-mid{display:flex;gap:12px;align-items:flex-start;justify-content:flex-end;margin:30px 0 14px}
.fav-mid .xs{text-align:left}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .plate{aspect-ratio:3/4}
.pair .fig{text-decoration:none;display:flex;flex-direction:column;gap:8px}
.pair .price b{font-size:19px}
.quote{font-size:clamp(18px,5.4vw,24px);line-height:1.02;letter-spacing:-0.045em;font-weight:500;text-transform:uppercase;margin:28px 0 24px}
.fav-foot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;margin-top:auto}
.price{display:flex;flex-direction:column;align-items:flex-start}
.price b{font-size:22px;font-weight:500;letter-spacing:-0.04em;line-height:1.1}
.price span{font-size:11.5px;color:var(--sub);font-weight:500}
.dark .price span{color:#9A9A97}

/* chapter */
.ch-mid{display:grid;grid-template-columns:32% minmax(0,1fr);gap:12px;margin-bottom:26px}
.ko-tag{display:block;font-size:14px;font-weight:600;letter-spacing:-0.02em;margin-top:10px}
.labels{display:flex;flex-direction:column;justify-content:space-around;padding:8px 0}
.labels .xs{display:block}
.labels .xs{font-size:13px}
.labels .xs b{display:block;font-weight:600;font-size:12px;color:var(--sub)}
.ch-mid .plate{aspect-ratio:3/4}
.chap{display:flex;flex-direction:column;gap:14px;scroll-margin-top:62px}
.pg.open .ov{position:absolute;left:22px;right:22px;bottom:24px;z-index:1;display:flex;flex-direction:column;gap:8px}
.pg.open .ov .ko-tag{margin:0;font-size:14px;font-weight:500;word-break:keep-all;text-wrap:pretty}
.pg.open::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(180deg,rgba(248,246,241,0),rgba(248,246,241,.94) 55%)}
.pg.open.dark::after{background:linear-gradient(180deg,rgba(28,28,28,0),rgba(28,28,28,.95) 50%)}
.pg.open .ov .disp{font-size:clamp(44px,14vw,72px)}
.stack{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.stack .st{display:grid;grid-template-columns:34% minmax(0,1fr);gap:12px;text-decoration:none;align-items:stretch}
.stack .st .plate{aspect-ratio:4/3}
.stack .lb{display:flex;flex-direction:column;gap:2px;padding-top:2px;font-size:14px;font-weight:500;line-height:1.35;letter-spacing:-0.02em}
.stack .lb b{font-size:12px;font-weight:600;color:var(--sub)}
.stack .lb em{font-style:normal;margin-top:auto;font-size:13px;color:var(--sub)}
.dark .stack .lb b,.dark .stack .lb em{color:#9A9A97}
.ch-foot{display:grid;grid-template-columns:minmax(0,1fr) 44%;gap:14px;align-items:end;margin:6px 0 24px}
.ch-foot .sm{text-align:left}

/* entries */
.items{border-top:1px solid currentColor}
details.it{border-bottom:1px solid var(--line)}
.dark details.it{border-bottom-color:#2F2F2F}
details.it{scroll-margin-top:72px}
details.it summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:64px minmax(0,1fr) auto;grid-template-rows:auto 1fr;column-gap:12px;row-gap:4px;align-items:start;padding:12px 0;min-height:88px}
details.it summary > .plate{grid-row:1 / 3;width:64px;height:64px}
details.it summary::-webkit-details-marker{display:none}
.it .no{display:block;font-size:12px;font-weight:500;color:var(--sub);margin-bottom:1px}
.it .nm{font-size:17px;font-weight:500;letter-spacing:-0.035em;line-height:1.3}
.it .tg{display:block;font-size:13px;color:var(--sub);font-weight:400;margin-top:3px;line-height:1.45;letter-spacing:-0.01em}
.dark .it .tg,.dark .it .no{color:#9A9A97}
.it .pr{text-align:right;font-size:15px;font-weight:500;letter-spacing:-0.02em;white-space:nowrap}
.it .pr s{display:block;color:var(--mute);font-size:11.5px;font-weight:400}
.it .best{display:inline-flex;align-items:center;height:15px;font-size:8px;font-weight:600;letter-spacing:.04em;border:1px solid currentColor;border-radius:8px;padding:0 6px;margin-left:6px;vertical-align:2px}
.it .more{grid-column:2 / 4;align-self:end;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);font-weight:500;margin-top:2px}
.it .more i{font-style:normal;display:inline-grid;place-items:center;width:26px;height:26px;border:1px solid currentColor;border-radius:50%;font-size:15px;line-height:1;transition:transform .2s}
details.it[open] .more i{transform:rotate(45deg)}

.det{padding:4px 0 20px;display:flex;flex-direction:column;gap:14px}
.det-img .plate{aspect-ratio:16/9}
.tl{display:flex;gap:2px;height:6px;margin:2px 0 6px}
.tl span{background:currentColor;opacity:.75}
.tl span:nth-child(even){opacity:.3}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts div{display:flex;flex-direction:column;gap:2px}
.facts b{font-size:14.5px;font-weight:500}
.flow .r{display:grid;grid-template-columns:84px minmax(0,1fr);font-weight:400}
.recs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.recs li{font-size:13.5px;color:var(--body)}
.dark .recs li{color:#BDBDBA}
.recs li::before{content:"— ";color:var(--mute)}

/* note */
#quote > .plate{aspect-ratio:16/10;margin:0 -22px 30px}
.stair{display:flex;flex-direction:column;gap:4px;margin:auto 0 30px}
.stair span{font-size:clamp(26px,8.4vw,42px);font-weight:500;letter-spacing:-0.065em;line-height:.95;text-transform:uppercase}
.stair span:nth-child(2){padding-left:30%}
.stair span:nth-child(3){padding-left:12%}
.stair span:nth-child(4){padding-left:48%}

/* designers */
.des{display:grid;grid-template-columns:1fr 1fr;gap:20px 12px;margin-top:26px}
.de{display:flex;flex-direction:column;gap:6px}
.de .plate{aspect-ratio:4/5;display:grid;place-items:center}
.de .plate b{font-size:40px;font-weight:500;letter-spacing:-0.06em;color:#C4C4C1}
.de .nm{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:500;letter-spacing:-0.03em}
.de .nm span{font-size:9.5px;color:var(--sub)}

/* back */
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;padding:0 22px;border-radius:28px;border:1px solid var(--ink);text-decoration:none;font-weight:600;font-size:15px;margin-top:18px}
.cta.solid{background:var(--ink);color:#fff}

/* chapter tabs (sticky) */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;margin:0 auto;max-width:540px;width:100%;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px;
  background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 20px -14px rgba(0,0,0,.5)}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);text-decoration:none;font-size:13px;font-weight:600;color:var(--body);white-space:nowrap}
.tabs a[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
/* floating bar */
.fbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;pointer-events:none;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.fbar div{pointer-events:auto;display:flex;gap:4px;padding:5px;border-radius:26px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px -12px rgba(0,0,0,.45)}
.fbar a{display:inline-flex;align-items:center;height:46px;padding:0 20px;border-radius:23px;text-decoration:none;font-size:14px;font-weight:600}
.fbar a.book-btn{background:var(--ink);color:#fff}

@media (min-width:520px){ .pg{padding:28px 32px 36px} .cover-img,#quote > .plate{margin-inline:-32px} .pg.open .ov{left:32px;right:32px} }
@media (max-width:350px){ .two{columns:1} }

/* ---------- 직원 화면 (서비스 북과 같은 모몽 OS 로그인) ---------- */
#staff{position:fixed;inset:0;z-index:30;overflow:auto;background:radial-gradient(130% 90% at 50% 35%,#E7E7E9 0%,#D5D5D8 100%) #D5D5D8;
  --ink:#1B1C1F;--sub:#5B5F68;--mute:#8A8E97;--point:#7F9BD6;--accent:#3F5FA8;color:var(--ink);font-size:17px;letter-spacing:-0.01em}
#staff[hidden]{display:none}
#staff button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
@keyframes in{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.g{background:linear-gradient(180deg,rgba(60,65,80,.05) 0%,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 62%,rgba(255,255,255,.38) 100%);border:1px solid rgba(255,255,255,.95);box-shadow:0 0 0 1px rgba(105,110,125,.24),0 16px 24px -14px rgba(20,25,40,.34),0 4px 8px -4px rgba(20,25,40,.12),inset 0 3px 3px -2px #fff,inset 0 -3px 3px -1px rgba(255,255,255,.95),inset 0 0 0 2px rgba(255,255,255,.28),inset 0 0 0 3px rgba(110,115,130,.08),inset 0 5px 10px -5px rgba(50,55,70,.20);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.gp{background:linear-gradient(180deg,rgba(120,150,215,.42) 0%,rgba(125,155,220,.55) 60%,rgba(185,205,245,.70) 100%);border:1px solid rgba(255,255,255,.92);box-shadow:0 0 0 1px rgba(75,100,165,.28),0 16px 24px -12px rgba(70,100,170,.55),0 4px 8px -4px rgba(70,100,170,.22),inset 0 3px 3px -2px #fff,inset 0 -3px 3px -1px rgba(235,242,255,.95),inset 0 0 0 2px rgba(255,255,255,.22),inset 0 5px 10px -5px rgba(40,65,130,.25);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.gw{background:linear-gradient(180deg,rgba(50,55,70,.07) 0%,rgba(255,255,255,0) 45%,rgba(255,255,255,.22) 100%);border:1px solid rgba(255,255,255,.95);box-shadow:0 0 0 1px rgba(105,110,125,.24),0 10px 16px -12px rgba(20,25,40,.26),inset 0 4px 7px -3px rgba(40,45,60,.22),inset 0 -3px 3px -1px #fff,inset 0 0 0 2px rgba(255,255,255,.22)}
.t{background:linear-gradient(180deg,#FBFBFC 0%,#F1F1F3 100%);border:0;box-shadow:0 14px 26px -12px rgba(30,35,50,.28),0 2px 5px rgba(30,35,50,.07),inset 0 1px 0 #fff,inset 0 -2px 3px rgba(0,0,0,.04)}
.flat{box-shadow:none}
.press{transition:transform .15s ease}
.press:active{transform:scale(.97)}
.pinrow{display:flex;justify-content:center;gap:14px;height:58px;border-radius:29px;align-items:center}
.pinrow i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:inset 0 2px 3px rgba(40,45,60,.25)}
.pinrow i.on{background:linear-gradient(180deg,#A7BBE6,#7F9BD6);box-shadow:0 3px 8px rgba(80,110,185,.45)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:420px;margin:0 auto;width:100%}
.keys button{height:64px;border-radius:22px;font-size:24px;font-weight:700}
.err{color:#9B3A33;font-size:14.5px;font-weight:650;text-align:center;min-height:22px}
.sw{width:64px;height:38px;border-radius:19px;padding:3px;display:flex;align-items:center}
.sw span{width:30px;height:30px;border-radius:50%;background:linear-gradient(180deg,#FFFFFF,#E9EAEE);box-shadow:0 4px 10px rgba(40,52,80,.3)}
.sw[aria-checked="true"]{justify-content:flex-end}
.sw[aria-checked="true"] span{background:linear-gradient(180deg,#A7BBE6,#7F9BD6);box-shadow:0 4px 10px rgba(80,110,185,.45)}
.lg{max-width:460px;margin:0 auto;min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;gap:22px;
  padding-block:32px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.lg.enter{animation:in .28s ease both}
.lglogo{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:18px}
.lglogo .o{width:96px;height:96px;border-radius:32px;display:flex;align-items:center;justify-content:center}
.lglogo .i{width:62px;height:62px;border-radius:22px;display:flex;align-items:center;justify-content:center}
.lgt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.lgt h1{font-size:26px;font-weight:780;letter-spacing:-0.6px;margin:0}
.lgt p{font-size:15px;color:var(--sub)}
.lgform{display:flex;flex-direction:column;gap:22px}
.lgf{display:flex;flex-direction:column;gap:8px}
.lgf label{font-size:13px;font-weight:600;color:var(--sub);padding-left:18px}
.fld{height:58px;border-radius:29px;display:flex;align-items:center;gap:10px;padding:0 22px}
.fld input{border:0;background:transparent;outline:none;font:inherit;font-size:17px;color:var(--ink);flex:1;min-width:0;letter-spacing:.02em}
.fld input::placeholder{color:var(--mute)}
.fld select{appearance:none;-webkit-appearance:none;border:0;background:transparent;outline:none;font:inherit;font-size:17px;color:var(--ink);flex:1;min-width:0;height:100%;cursor:pointer}
.fld .chev{flex:none}
.fld:focus-within{box-shadow:0 0 0 2px var(--point),inset 0 4px 7px -3px rgba(40,45,60,.22)}
.lgform .err{margin:-10px 0 -8px;min-height:20px}
.lgbtns{display:flex;gap:12px;margin-top:8px}
.lgmain{flex:1;height:60px;border-radius:30px;font-size:17px;font-weight:700}

<script>
/* ---------- helpers ---------- */
const won = n => n.toLocaleString("ko-KR");
const dur = m => m < 60 ? `${m}분` : `${Math.floor(m/60)}시간${m%60 ? " " + m%60 + "분" : ""}`;
const clock = m => `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`;
const pad = n => String(n).padStart(2, "0");
/* 네이버 '추천' 표시가 붙은 메뉴 */
const NAVER_PICKS = ["consult-basic", "cut-design"];
/* 로그인한 디자이너 기준 가격 — 서비스 북과 같은 규칙 (지정 예약 / 첫방문) */
function priceOf(s){
  const row = PRICES[s.id] || {}, r = row[state.me];
  if(!r) return null;
  if(state.visit === "first"){
    const f = row.first;
    if(!f) return {p:r[0], n:r[1], note:"첫방문 혜택이 적용되지 않는 메뉴예요"};
    const base = Math.max(r[0], f[1] || 0);
    return {p:f[0], n: base > f[0] ? base : null, note:"첫방문 혜택가", first:true};
  }
  return {p:r[0], n:r[1], note:r[2] || s.priceNote};
}
const offered = s => !!priceOf(s);
function range(s){ const x = priceOf(s); return {mn:x.p, mx:x.p, normal:x.n, text:won(x.p), note:x.note}; }
const timeTxt = s => s.timeText || ("약 " + dur(s.min));
const catRange = id => { const r = SERVICES.filter(s => s.cat === id && offered(s)).map(range); return `${won(Math.min(...r.map(x=>x.mn)))}–${won(Math.max(...r.map(x=>x.mx)))}`; };
const strip = t => t.replace(/^\[[^\]]+\]\s*/, "");
/* 개인 메뉴판: 이름은 맨 위에 한 번만 — 메뉴명·설명 속 디자이너 이름을 덜어 낸다 */
function nm(t){
  const d = meD(); if(!d || !t) return t;
  return t.replace(new RegExp(`${d.name}\\s?(대표원장|원장|부원장|실장|디자이너)의\\s*`, "g"), "").replace(new RegExp(`${d.name}(쌤|원장)\\s*`, "g"), "").replace(/\s{2,}/g, " ").trim();
}

const CAT_PAGES = [
  {id:"consult", en:["3WAY", "Consulting"], line:"얼굴 · 컬러 · 골격, 세 방향으로 나를 먼저 봅니다.", plate:"rings"},
  {id:"cut", en:["The", "Cut"], line:"정돈하는 디자인컷부터 방향을 바꾸는 FIT CUT까지.", plate:"cut"},
  {id:"perm", en:["Perm", "& Magic"], line:"얼굴형과 모질에 맞춘 컬과 볼륨.", plate:"wave"},
  {id:"mens", en:["Men's", "Grooming"], line:"매일 손질하기 편한 스타일.", plate:"crop"},
  {id:"color", en:["The", "Color"], line:"오늘의 나에게 어울리는 색.", plate:"ombre"},
  {id:"care", en:["Clinic", "& Scalp"], line:"모발의 힘과 윤기, 두피의 휴식.", plate:"sheen"},
  {id:"signature", en:["The", "Signature"], line:"이 디자이너에게만 예약할 수 있는 디자인.", plate:"curl", dark:true}
];

/* ---------- hair study plates (generative, deterministic) ---------- */
function rng(seed){ let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function drawPlate(cv){
  const type = cv.dataset.plate, dark = cv.dataset.dark === "1";
  const box = cv.parentElement.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = Math.max(10, box.width), H = Math.max(10, box.height);
  cv.width = W * dpr; cv.height = H * dpr;
  const c = cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,W,H);
  const seed = [...(cv.dataset.seed || type)].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) >>> 0, 7);
  const r = rng(seed + Math.round(W)), v = rng(seed)(), v2 = rng(seed * 7 + 3)();
  const ink = dark ? "rgba(240,240,236," : "rgba(20,20,20,";
  const k = Math.min(1, Math.max(0.3, W / 320)); // 작은 썸네일은 결을 성기게
  c.lineCap = "round";
  const strands = (n, fn, alpha=0.55, lw=0.9) => { n = Math.round(n * k); for(let i=0;i<n;i++){ c.beginPath(); fn(i, n); c.strokeStyle = ink + (alpha * (0.45 + r()*0.55)) + ")"; c.lineWidth = lw * (0.6 + r()*0.8); c.stroke(); } };
  if(type === "cut"){ // 곧은 머리카락이 사선으로 잘린 끝
    strands(140, (i, n) => { const x = W*0.12 + (W*0.76)*(i/n) + (r()-.5)*3; const end = H*(0.22 + v*0.2) + (x/W)*H*(0.2 + v2*0.4) + (r()-.5)*4; c.moveTo(x, -5); c.bezierCurveTo(x + (r()-.5)*6, H*0.2, x + (r()-.5)*6, end*0.8, x + (r()-.5)*2, end); });
    c.strokeStyle = ink + "0.9)"; c.lineWidth = 1; c.setLineDash([3,4]); c.beginPath(); const ya = H*(0.22 + v*0.2), yb = H*(0.2 + v2*0.4); c.moveTo(W*0.06, ya + 0.06*yb); c.lineTo(W*0.94, ya + 0.94*yb); c.stroke(); c.setLineDash([]);
  } else if(type === "wave" || type === "curl"){
    const amp = (type === "curl" ? 12 : 7) * (0.7 + v*0.8) * Math.max(0.5, k), freq = (type === "curl" ? 0.05 : 0.03) * (0.7 + v2*0.7) / Math.max(0.5, k);
    strands(110, (i, n) => { const x0 = W*0.1 + W*0.8*(i/n); const ph = r()*0.6 + i*0.02; c.moveTo(x0, -5); for(let y=0; y<=H+5; y+=4){ const a = amp * (0.4 + y/H); c.lineTo(x0 + Math.sin(y*freq + ph*6) * a, y); } }, 0.5);
  } else if(type === "crop"){ // 짧게 세운 결
    for(let row=0; row<10 + Math.round(v*6); row++) strands(36, (i, n) => { const x = W*0.08 + W*0.84*(i/n) + (r()-.5)*6; const y = H*0.12 + row*H*0.058; const L = 14 * Math.max(0.45, k), ang = -Math.PI/2 + (x/W - .5)*0.9 + (v2 - .5)*0.8 + (r()-.5)*0.2; c.moveTo(x, y + L); c.lineTo(x + Math.cos(ang)*L, y + L + Math.sin(ang)*L); }, 0.6, 1);
  } else if(type === "ombre"){ // 뿌리는 진하고 끝으로 갈수록 밝아지는 결
    const on = Math.round(150 * k); for(let i=0;i<on;i++){ const x = W*0.08 + W*0.84*(i/on) + (r()-.5)*3; const g = c.createLinearGradient(0,0,0,H); g.addColorStop(0, ink + "0.85)"); g.addColorStop(0.25 + v*0.4, ink + "0.45)"); g.addColorStop(1, ink + "0.04)"); c.beginPath(); c.moveTo(x, -5); c.bezierCurveTo(x + (r()-.5)*10, H*0.35, x + (r()-.5)*14, H*0.7, x + (r()-.5)*10, H+5); c.strokeStyle = g; c.lineWidth = 0.6 + r()*0.8; c.stroke(); }
  } else if(type === "sheen"){ // 매끈한 결 + 윤기 띠
    strands(160, (i, n) => { const x = W*0.06 + W*0.88*(i/n); c.moveTo(x, -5); c.bezierCurveTo(x - 6, H*0.4, x + 6, H*0.6, x, H+5); }, 0.35, 0.7);
    const sy = H*(0.2 + v*0.4); const g = c.createLinearGradient(0, sy, 0, sy + H*0.16); g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(.5, dark ? "rgba(255,255,255,.18)" : "rgba(255,255,255,.85)"); g.addColorStop(1, "rgba(255,255,255,0)"); c.fillStyle = g; c.fillRect(0, sy, W, H*0.16);
  } else if(type === "rings"){ // 3WAY: 이목구비 · 컬러 · 골격
    const R = Math.min(W, H) * (0.2 + v*0.08), cx = W/2, cy = H*0.48, label = W > 140;
    [[cx, cy - R*0.62, "FACE"], [cx - R*0.62, cy + R*0.42, "COLOR"], [cx + R*0.62, cy + R*0.42, "BODY"]].forEach(([x, y, t]) => {
      c.beginPath(); c.arc(x, y, R, 0, Math.PI*2); c.strokeStyle = ink + "0.75)"; c.lineWidth = 1; c.stroke();
      for(let k=0;k<26;k++){ const rr = R - 3 - k*1.6; if(rr <= 1) break; c.beginPath(); c.arc(x, y, rr, 0, Math.PI*2); c.strokeStyle = ink + (0.06) + ")"; c.lineWidth = .6; c.stroke(); }
      c.fillStyle = ink + "0.7)"; c.font = "500 10px " + getComputedStyle(document.body).getPropertyValue("--mono"); c.textAlign = "center"; if(label) c.fillText(t, x, y + (t === "FACE" ? -R*0.35 : R*0.45));
    });
    if(label){ c.fillStyle = ink + "0.9)"; c.font = "600 13px Pretendard, sans-serif"; c.fillText("나다움", cx, cy + 4); }
  } else { // cover: 흘러내리는 긴 머리 한 다발
    strands(220, (i, n) => { const t = i/n; const x0 = W*(0.12 + v*0.12 + t*0.5); c.moveTo(x0, -5); c.bezierCurveTo(x0 + W*(0.04 + v2*0.14), H*0.28, x0 - W*0.12 + t*W*0.1, H*0.62, x0 + W*0.22 - t*W*0.06 + (r()-.5)*10, H+5); }, 0.42, 0.8);
  }
}
function drawAll(){ document.querySelectorAll("canvas[data-plate]").forEach(drawPlate); }

/* ---------- pages ---------- */
let page = 0;
const run = () => `<div class="run"><span>Merci Momong</span><span>${++page}.</span></div>`;
/* 사진 자리: PHOTOS(data.js)에 사진이 있으면 사진, 없으면 헤어 스터디 그림 */
const plate = (type, cap, dark, seed, photo) => `<div class="plate">${photo ? `<img src="${photo}" alt="" loading="lazy">` : `<canvas data-plate="${type}" data-seed="${seed || type}" data-dark="${dark?1:0}" aria-hidden="true"></canvas>`}${cap && !photo ? `<span class="cap">${cap}</span>` : ""}</div>`;
/* PHOTOS 의 파일 경로 → 빌드 때 묶은 사진 (없으면 빈 값 → 헤어 스터디 그림) */
const photo = k => { const f = PHOTOS[k]; return f ? (PHOTO_DATA[f] || "") : ""; };
const PLATE_BY_CAT = {consult:"rings", cut:"cut", perm:"wave", mens:"crop", color:"ombre", care:"sheen", signature:"curl"};
function plateType(s){
  const id = s.id;
  if(/magic|iron|down/.test(id)) return s.cat === "mens" ? "crop" : "sheen";
  if(/bleach|ombre/.test(id)) return "ombre";
  if(/spa|scaling|headspa|forest/.test(id)) return "sheen";
  if(s.cat === "signature") return /cut/.test(id) ? "cut" : /ombre/.test(id) ? "ombre" : /slick|leaf|long|hunryul|won/.test(id) ? "crop" : "curl";
  return PLATE_BY_CAT[s.cat] || "cover";
}
const svcPlate = (s, cap, dark) => plate(plateType(s), cap, dark, s.id, photo(s.id));
const cat = id => CATS.find(c => c.id === id);
const SUB = {consult:["Know Yourself", "First"], cut:["Shaped To", "Your Face"], perm:["Movement", "That Lasts"], mens:["Easy Every", "Morning"], color:["The Color", "That Is You"], care:["Strength", "From Within"], signature:["Signed By", "Designer"]};

function benefits(){

    <h2 class="h2" style="margin-bottom:26px">Good to<br>Know</h2>
    <div class="rules"><span class="pill">Benefits</span>${GIFTS.map((g, i) => `<div class="r" style="flex-direction:column;gap:4px;padding:12px 0"><span style="font-size:13px">${pad(i + 1)}. ${g.h}</span><span class="sm" style="color:var(--body)">${g.p}</span></div>`).join("")}</div>
    <p class="xs" style="margin-top:16px;color:var(--sub)">금액은 디자이너·기장·모발 상태에 따라 달라질 수 있어요. 정확한 금액은 상담 후 안내드려요.</p>
  </section>`;
}
function back(){
  return `<section class="pg tall" id="visit">${run()}
    <h2 class="disp">See you<br>soon.</h2>
    <div class="grow"></div>
    <div class="st-row"><span class="pill">Visit</span><p class="sm" style="text-align:left">메르시모몽<br>서울 서초구 방배천로 5-1 우성빌딩 6층</p></div>
    <a class="cta solid" href="https://naver.me/FaOg9wsW" target="_blank" rel="noopener"><span>네이버로 예약하기</span><span>→</span></a>
  </section>`;
}
/* ---------- 로그인 (서비스 북과 동일: 지점 · 이름 · 공용 코드 → 고객 유형) ---------- */
const ME_KEY = "mm-servicebook-me", BRANCH_KEY = "mm-servicebook-branch", VISIT_KEY = "mm-servicebook-visit";
const ls = { get: k => { try { return localStorage.getItem(k); } catch(e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} }, del: k => { try { localStorage.removeItem(k); } catch(e) {} } };
const branchOf = k => BRANCHES.find(b => b.key === k);
const meD = () => DESIGNERS.find(d => d.key === state.me);
const state = { me: ls.get(ME_KEY), branch: ls.get(BRANCH_KEY) || (BRANCHES.length === 1 ? BRANCHES[0].key : ""), visit: ls.get(VISIT_KEY) || "pick", keep: true, err: "", name: "", pin: "", unlocked: false, view: "login" };
if(!meD() || !branchOf(state.branch)) state.me = null;
state.view = state.me ? "book" : "login";
const staff = document.getElementById("staff"), book = document.getElementById("book"), fbar = document.querySelector(".fbar");
const heart = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1B1C1F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.3-7-9.5A4 4 0 0 1 12 8a4 4 0 0 1 7 2.5C19 15.7 12 20 12 20z"/></svg>';
const lockI = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A8E97" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
const pinI = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A8E97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg>';

function loginView(){
  return `<div class="lg enter">
    <div class="lglogo"><div class="g o"><div class="gp i">${heart}</div></div><div class="lgt"><h1>메르시모몽 브로셔</h1><p>지점 · 이름 · 공용 코드로 시작해요</p></div></div>
    <form class="lgform" id="lgform" autocomplete="off">
      <div class="lgf"><label for="lg-branch">지점</label><div class="gw fld">${pinI}<select id="lg-branch">${BRANCHES.length > 1 ? `<option value="">지점 선택</option>` : ""}${BRANCHES.map(b => `<option value="${b.key}" ${state.branch===b.key?"selected":""}>${b.name}</option>`).join("")}</select></div></div>
      <div class="lgf"><label for="lg-name">이름</label><div class="gw fld"><input id="lg-name" list="lg-names" placeholder="디자이너 이름" value="${state.name}" autocomplete="off"></div></div>
      <datalist id="lg-names">${DESIGNERS.map(d => `<option value="${d.name}">`).join("")}</datalist>
      <div class="lgf"><label for="lg-code">공용 코드</label><div class="gw fld">${lockI}<input id="lg-code" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="지점 공용 코드"></div></div>
      <p class="err" role="alert">${state.err}</p>
      <div class="lgbtns"><button type="submit" class="gp press lgmain">시작하기</button></div>
      <div class="lgkeep"><span>이 기기에서 로그인 유지</span><button type="button" class="sw gw" role="switch" aria-checked="${state.keep}" aria-label="이 기기에서 로그인 유지" data-keep><span></span></button></div>
    </form>
    <p class="lgfoot">가격 기준 · 네이버 예약 ${SOURCE_DATE} 확인</p>
  </div>`;
}
const visitCards = () => `<div class="vgrid">${[["pick","지정 예약 고객","내 메뉴 가격으로 보여요"],["first","첫방문 고객","첫방문 혜택가로 보여요. 혜택이 없는 메뉴는 일반 가격으로 보여요"]].map(([k,t,d]) => `<button class="${state.visit===k?"gp":"g"} press vcard" data-visit="${k}" aria-pressed="${state.visit===k}"><b>${t}</b><span>${d}</span></button>`).join("")}</div>`;
const keypad = () => `<div class="pinrow gw" aria-label="공용 코드 ${state.pin.length}자리 입력됨">${[0,1,2,3].map(i => `<i class="${i<state.pin.length?"on":""}"></i>`).join("")}</div><p class="err" role="alert">${state.err}</p>
  <div class="keys">${["1","2","3","4","5","6","7","8","9","del","0","ok"].map(k => k==="del" ? `<button class="g press" data-key="del" aria-label="지우기">←</button>` : k==="ok" ? `<button class="gp press" data-key="ok" style="font-size:17px">확인</button>` : `<button class="t press" data-key="${k}">${k}</button>`).join("")}</div>`;
function visitView(){
  return `<div class="staff-in"><div class="lglogo"><div class="g o"><div class="gp i">${heart}</div></div></div><h1>이번 고객님은 어떤 예약인가요?</h1><p class="sub">${meD().name} ${meD().role} · 직원 전용</p>${visitCards()}</div>`;
}
function accountView(){
  if(!state.unlocked) return `<div class="staff-in"><button class="g press staff-back" data-close>← 브로셔로</button><h1>공용 코드를 입력해 주세요</h1><p class="sub">고객 유형 변경과 로그아웃은 직원만 할 수 있어요</p>${keypad()}</div>`;
  return `<div class="staff-in"><button class="g press staff-back" data-close>← 브로셔로</button><h1>내 메뉴판 설정</h1><p class="sub">${meD().name} ${meD().role} · 직원 전용</p>
    <p style="font-weight:750;margin:6px 0 -6px">고객 유형</p>${visitCards()}
    <button class="g press lgsub" data-logout style="flex:none">로그아웃</button></div>`;
}
function bookHtml(){
  page = 0;
  return cover() + statement() + collage("a", ["mood2", "mood5", "mood4", "mood6"], "See your own beauty", "Merci Momong") + contents() + favorite()
    + visibleChapters().map(chapter).join("") + collage("b", ["mood1", "mood3", "cat:consult", "cat:mens"], "Be yourself", "3Way Hair Consulting") + note() + designers() + benefits() + back();
}
function render(){
  const v = state.me ? state.view : "login";
  if(v === "book"){
    staff.hidden = true; staff.innerHTML = ""; fbar.hidden = false;
    book.innerHTML = bookHtml(); bindBook(); requestAnimationFrame(drawAll);
    const tabs = document.getElementById("tabs"); tabs.hidden = false;
    tabs.innerHTML = `<a href="#contents">목차</a>` + visibleChapters().map(c => `<a href="#ch-${c.id}" data-tab="ch-${c.id}">${cat(c.id).ko}</a>`).join("") + `<a href="#benefits" data-tab="benefits">혜택</a>`;
    watchTabs();
  } else {
    fbar.hidden = true; staff.hidden = false; document.getElementById("tabs").hidden = true;
    staff.innerHTML = v === "login" ? loginView() : v === "visit" ? visitView() : accountView();
    bindStaff();
  }
}
function finishLogin(key){
  state.me = key; state.err = "";
  if(state.keep){ ls.set(ME_KEY, key); ls.set(BRANCH_KEY, state.branch); } else { ls.del(ME_KEY); ls.del(BRANCH_KEY); }
  state.view = "visit"; render();
}
function bindStaff(){
  const f = staff.querySelector("#lgform");
  if(f) f.onsubmit = e => {
    e.preventDefault();
    const v = id => (staff.querySelector("#" + id) || {}).value || "";
    const branch = v("lg-branch"), name = v("lg-name").trim(), code = v("lg-code");
    state.branch = branch; state.name = name;
    const fail = m => { state.err = m; render(); };
    if(!branch) return fail("지점을 골라 주세요.");
    if(!name) return fail("이름을 입력해 주세요.");
    const n = name.replace(/\s+/g, "");
    const d = DESIGNERS.find(x => n === x.name || n === (x.name + x.role).replace(/\s+/g, "") || (n.startsWith(x.name) && n.length <= x.name.length + 4));
    if(!d || !branchOf(branch).designers.includes(d.key)) return fail("이 지점에 등록된 디자이너 이름이 아니에요.");
    if(!code) return fail("공용 코드를 입력해 주세요.");
    if(code !== branchOf(branch).code) return fail("공용 코드가 맞지 않아요.");
    state.name = ""; finishLogin(d.key);
  };
  staff.querySelectorAll("[data-keep]").forEach(b => b.onclick = () => { state.keep = !state.keep; b.setAttribute("aria-checked", state.keep); });
  staff.querySelectorAll("[data-visit]").forEach(b => b.onclick = () => { state.visit = b.dataset.visit; ls.set(VISIT_KEY, state.visit); state.view = "book"; state.unlocked = false; render(); window.scrollTo(0, 0); });
  staff.querySelectorAll("[data-close]").forEach(b => b.onclick = () => { state.view = "book"; state.unlocked = false; state.pin = ""; state.err = ""; render(); });
  staff.querySelectorAll("[data-logout]").forEach(b => b.onclick = () => { state.me = null; state.unlocked = false; state.visit = "pick"; [ME_KEY, VISIT_KEY].forEach(ls.del); state.view = "login"; render(); });
  staff.querySelectorAll("[data-key]").forEach(b => b.onclick = () => {
    const k = b.dataset.key; state.err = "";
    if(k === "del") state.pin = state.pin.slice(0, -1);
    else { if(k !== "ok" && state.pin.length < 8) state.pin += k;
      const need = branchOf(state.branch).code.length;
      if(k === "ok" || state.pin.length >= need){ const ok = state.pin === branchOf(state.branch).code; state.pin = ""; if(ok) state.unlocked = true; else state.err = "공용 코드가 맞지 않아요."; } }
    render();
  });
}
/* 대표 메뉴 사진을 누르면 그 메뉴를 펼친다 */
function openFromHash(){
  const t = location.hash && document.getElementById(location.hash.slice(1));
  if(t && t.matches("details.it")) t.open = true;
}
addEventListener("hashchange", openFromHash);
function bindBook(){
  /* 숨겨진 입구: 페이지 머리줄을 1.5초 길게 누르면 설정 */
  book.querySelectorAll(".run").forEach(el => {
    let t; const clear = () => clearTimeout(t);
    el.addEventListener("pointerdown", () => { t = setTimeout(() => { state.view = "account"; state.unlocked = false; state.pin = ""; render(); }, 1500); });
    ["pointerup","pointerleave","pointercancel"].forEach(e => el.addEventListener(e, clear));
  });
}
let io;
function watchTabs(){
  if(io) io.disconnect();
  const tabs = [...document.querySelectorAll("#tabs [data-tab]")];
  io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ tabs.forEach(t => t.setAttribute("aria-current", t.dataset.tab === e.target.id)); const on = tabs.find(t => t.dataset.tab === e.target.id); if(on) on.scrollIntoView({block:"nearest", inline:"center"}); } }), {rootMargin:"-40% 0px -55% 0px"});
  tabs.forEach(t => { const sec = document.getElementById(t.dataset.tab); if(sec) io.observe(sec); });
}
render();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawAll, 150); });
document.fonts && document.fonts.ready.then(drawAll);
</script>

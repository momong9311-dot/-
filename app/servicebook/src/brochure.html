<script>
/* ---------- helpers ---------- */
const won = n => n.toLocaleString("ko-KR");
const dur = m => m < 60 ? `${m}분` : `${Math.floor(m/60)}시간${m%60 ? " " + m%60 + "분" : ""}`;
const clock = m => `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`;
const pad = n => String(n).padStart(2, "0");
/* 네이버 '추천' 표시가 붙은 메뉴 */
const NAVER_PICKS = ["consult-basic", "cut-design"];
/* 로그인한 디자이너 기준 가격 — 서비스 북과 같은 규칙 (지정 예약 / 첫방문) */
function priceOf(s){
  const row = PRICES[s.id] || {}, r = row[state.me];
  if(!r) return null;
  if(state.visit === "first"){
    const f = row.first;
    if(!f) return {p:r[0], n:r[1], note:"첫방문 혜택이 적용되지 않는 메뉴예요"};
    const base = Math.max(r[0], f[1] || 0);
    return {p:f[0], n: base > f[0] ? base : null, note:"첫방문 혜택가", first:true};
  }
  return {p:r[0], n:r[1], note:r[2] || s.priceNote};
}
const offered = s => !!priceOf(s);
function range(s){ const x = priceOf(s); return {mn:x.p, mx:x.p, normal:x.n, text:won(x.p), note:x.note}; }
const timeTxt = s => s.timeText || ("약 " + dur(s.min));
const catRange = id => { const r = SERVICES.filter(s => s.cat === id && offered(s)).map(range); return `${won(Math.min(...r.map(x=>x.mn)))}–${won(Math.max(...r.map(x=>x.mx)))}`; };
const strip = t => t.replace(/^\[[^\]]+\]\s*/, "");
/* 개인 메뉴판: 이름은 맨 위에 한 번만 — 메뉴명·설명 속 디자이너 이름을 덜어 낸다 */
function nm(t){
  const d = meD(); if(!d || !t) return t;
  return t.replace(new RegExp(`${d.name}\\s?(대표원장|원장|부원장|실장|디자이너)의\\s*`, "g"), "").replace(new RegExp(`${d.name}(쌤|원장)\\s*`, "g"), "").replace(/\s{2,}/g, " ").trim();

/* ---------- hair study plates (generative, deterministic) ---------- */
function rng(seed){ let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function drawPlate(cv){
  const type = cv.dataset.plate, dark = cv.dataset.dark === "1";
  const box = cv.parentElement.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = Math.max(10, box.width), H = Math.max(10, box.height);
  cv.width = W * dpr; cv.height = H * dpr;
  const c = cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,W,H);
  const r = rng(type.length * 977 + Math.round(W));
  const ink = dark ? "rgba(240,240,236," : "rgba(20,20,20,";
  c.lineCap = "round";
  const strands = (n, fn, alpha=0.55, lw=0.9) => { for(let i=0;i<n;i++){ c.beginPath(); fn(i, n); c.strokeStyle = ink + (alpha * (0.45 + r()*0.55)) + ")"; c.lineWidth = lw * (0.6 + r()*0.8); c.stroke(); } };
  if(type === "cut"){ // 곧은 머리카락이 사선으로 잘린 끝
    strands(140, (i, n) => { const x = W*0.12 + (W*0.76)*(i/n) + (r()-.5)*3; const end = H*0.30 + (x/W)*H*0.42 + (r()-.5)*4; c.moveTo(x, -5); c.bezierCurveTo(x + (r()-.5)*6, H*0.2, x + (r()-.5)*6, end*0.8, x + (r()-.5)*2, end); });
    c.strokeStyle = ink + "0.9)"; c.lineWidth = 1; c.setLineDash([3,4]); c.beginPath(); c.moveTo(W*0.06, H*0.30); c.lineTo(W*0.94, H*0.72); c.stroke(); c.setLineDash([]);
  } else if(type === "wave" || type === "curl"){
    const amp = type === "curl" ? 16 : 10, freq = type === "curl" ? 0.06 : 0.035;
    strands(110, (i, n) => { const x0 = W*0.1 + W*0.8*(i/n); const ph = r()*0.6 + i*0.02; c.moveTo(x0, -5); for(let y=0; y<=H+5; y+=4){ const a = amp * (0.4 + y/H); c.lineTo(x0 + Math.sin(y*freq + ph*6) * a, y); } }, 0.5);
  } else if(type === "crop"){ // 짧게 세운 결
    for(let row=0; row<14; row++) strands(36, (i, n) => { const x = W*0.08 + W*0.84*(i/n) + (r()-.5)*6; const y = H*0.12 + row*H*0.058; const ang = -Math.PI/2 + (x/W - .5)*0.9 + (r()-.5)*0.2; c.moveTo(x, y + 12); c.lineTo(x + Math.cos(ang)*14, y + 12 + Math.sin(ang)*14); }, 0.6, 1);
  } else if(type === "ombre"){ // 뿌리는 진하고 끝으로 갈수록 밝아지는 결
    for(let i=0;i<150;i++){ const x = W*0.08 + W*0.84*(i/150) + (r()-.5)*3; const g = c.createLinearGradient(0,0,0,H); g.addColorStop(0, ink + "0.85)"); g.addColorStop(0.45, ink + "0.45)"); g.addColorStop(1, ink + "0.04)"); c.beginPath(); c.moveTo(x, -5); c.bezierCurveTo(x + (r()-.5)*10, H*0.35, x + (r()-.5)*14, H*0.7, x + (r()-.5)*10, H+5); c.strokeStyle = g; c.lineWidth = 0.6 + r()*0.8; c.stroke(); }
  } else if(type === "sheen"){ // 매끈한 결 + 윤기 띠
    strands(160, (i, n) => { const x = W*0.06 + W*0.88*(i/n); c.moveTo(x, -5); c.bezierCurveTo(x - 6, H*0.4, x + 6, H*0.6, x, H+5); }, 0.35, 0.7);
    const g = c.createLinearGradient(0, H*0.34, 0, H*0.5); g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(.5, dark ? "rgba(255,255,255,.18)" : "rgba(255,255,255,.85)"); g.addColorStop(1, "rgba(255,255,255,0)"); c.fillStyle = g; c.fillRect(0, H*0.34, W, H*0.16);
  } else if(type === "rings"){ // 3WAY: 이목구비 · 컬러 · 골격
    const R = Math.min(W, H) * 0.24, cx = W/2, cy = H*0.48;
    [[cx, cy - R*0.62, "FACE"], [cx - R*0.62, cy + R*0.42, "COLOR"], [cx + R*0.62, cy + R*0.42, "BODY"]].forEach(([x, y, t]) => {
      c.beginPath(); c.arc(x, y, R, 0, Math.PI*2); c.strokeStyle = ink + "0.75)"; c.lineWidth = 1; c.stroke();
      for(let k=0;k<26;k++){ const rr = R - 3 - k*1.6; if(rr <= 1) break; c.beginPath(); c.arc(x, y, rr, 0, Math.PI*2); c.strokeStyle = ink + (0.06) + ")"; c.lineWidth = .6; c.stroke(); }
      c.fillStyle = ink + "0.7)"; c.font = "500 10px " + getComputedStyle(document.body).getPropertyValue("--mono"); c.textAlign = "center"; c.fillText(t, x, y + (t === "FACE" ? -R*0.35 : R*0.45));
    });
    c.fillStyle = ink + "0.9)"; c.font = "600 13px Pretendard, sans-serif"; c.fillText("나다움", cx, cy + 4);
  } else { // cover: 흘러내리는 긴 머리 한 다발
    strands(220, (i, n) => { const t = i/n; const x0 = W*(0.18 + t*0.5); c.moveTo(x0, -5); c.bezierCurveTo(x0 + W*0.1, H*0.28, x0 - W*0.12 + t*W*0.1, H*0.62, x0 + W*0.22 - t*W*0.06 + (r()-.5)*10, H+5); }, 0.42, 0.8);
  }
}

}
const visitCards = () => `<div class="vgrid">${[["pick","지정 예약 고객","내 메뉴 가격으로 보여요"],["first","첫방문 고객","첫방문 혜택가로 보여요. 혜택이 없는 메뉴는 일반 가격으로 보여요"]].map(([k,t,d]) => `<button class="${state.visit===k?"gp":"g"} press vcard" data-visit="${k}" aria-pressed="${state.visit===k}"><b>${t}</b><span>${d}</span></button>`).join("")}</div>`;
const keypad = () => `<div class="pinrow gw" aria-label="공용 코드 ${state.pin.length}자리 입력됨">${[0,1,2,3].map(i => `<i class="${i<state.pin.length?"on":""}"></i>`).join("")}</div><p class="err" role="alert">${state.err}</p>
  <div class="keys">${["1","2","3","4","5","6","7","8","9","del","0","ok"].map(k => k==="del" ? `<button class="g press" data-key="del" aria-label="지우기">←</button>` : k==="ok" ? `<button class="gp press" data-key="ok" style="font-size:17px">확인</button>` : `<button class="t press" data-key="${k}">${k}</button>`).join("")}</div>`;
function visitView(){
  return `<div class="staff-in"><div class="lglogo"><div class="g o"><div class="gp i">${heart}</div></div></div><h1>이번 고객님은 어떤 예약인가요?</h1><p class="sub">${meD().name} ${meD().role} · 직원 전용</p>${visitCards()}</div>`;
}
function accountView(){
  if(!state.unlocked) return `<div class="staff-in"><button class="g press staff-back" data-close>← 브로셔로</button><h1>공용 코드를 입력해 주세요</h1><p class="sub">고객 유형 변경과 로그아웃은 직원만 할 수 있어요</p>${keypad()}</div>`;
  return `<div class="staff-in"><button class="g press staff-back" data-close>← 브로셔로</button><h1>내 메뉴판 설정</h1><p class="sub">${meD().name} ${meD().role} · 직원 전용</p>
    <p style="font-weight:750;margin:6px 0 -6px">고객 유형</p>${visitCards()}
    <button class="g press lgsub" data-logout style="flex:none">로그아웃</button></div>`;
}
function bookHtml(){
  page = 0;
  return cover() + statement() + bleed("wave", "Hair Study — Movement") + contents() + favorite()
    + visibleChapters().map(chapter).join("") + note() + designers() + benefits() + back();
}
function render(){
  const v = state.me ? state.view : "login";
  if(v === "book"){
    staff.hidden = true; staff.innerHTML = ""; fbar.hidden = false;
    book.innerHTML = bookHtml(); bindBook(); requestAnimationFrame(drawAll);
  } else {
    fbar.hidden = true; staff.hidden = false;
    staff.innerHTML = v === "login" ? loginView() : v === "visit" ? visitView() : accountView();
    bindStaff();
  }
}
function finishLogin(key){
  state.me = key; state.err = "";
  if(state.keep){ ls.set(ME_KEY, key); ls.set(BRANCH_KEY, state.branch); } else { ls.del(ME_KEY); ls.del(BRANCH_KEY); }
  state.view = "visit"; render();
}
function bindStaff(){
  const f = staff.querySelector("#lgform");
  if(f) f.onsubmit = e => {
    e.preventDefault();
    const v = id => (staff.querySelector("#" + id) || {}).value || "";
    const branch = v("lg-branch"), name = v("lg-name").trim(), code = v("lg-code");
    state.branch = branch; state.name = name;
    const fail = m => { state.err = m; render(); };
    if(!branch) return fail("지점을 골라 주세요.");
    if(!name) return fail("이름을 입력해 주세요.");
    const n = name.replace(/\s+/g, "");
    const d = DESIGNERS.find(x => n === x.name || n === (x.name + x.role).replace(/\s+/g, "") || (n.startsWith(x.name) && n.length <= x.name.length + 4));
    if(!d || !branchOf(branch).designers.includes(d.key)) return fail("이 지점에 등록된 디자이너 이름이 아니에요.");
    if(!code) return fail("공용 코드를 입력해 주세요.");
    if(code !== branchOf(branch).code) return fail("공용 코드가 맞지 않아요.");
    state.name = ""; finishLogin(d.key);
  };
  staff.querySelectorAll("[data-keep]").forEach(b => b.onclick = () => { state.keep = !state.keep; b.setAttribute("aria-checked", state.keep); });
  staff.querySelectorAll("[data-visit]").forEach(b => b.onclick = () => { state.visit = b.dataset.visit; ls.set(VISIT_KEY, state.visit); state.view = "book"; state.unlocked = false; render(); window.scrollTo(0, 0); });
  staff.querySelectorAll("[data-close]").forEach(b => b.onclick = () => { state.view = "book"; state.unlocked = false; state.pin = ""; state.err = ""; render(); });
  staff.querySelectorAll("[data-logout]").forEach(b => b.onclick = () => { state.me = null; state.unlocked = false; state.visit = "pick"; [ME_KEY, VISIT_KEY].forEach(ls.del); state.view = "login"; render(); });
  staff.querySelectorAll("[data-key]").forEach(b => b.onclick = () => {
    const k = b.dataset.key; state.err = "";
    if(k === "del") state.pin = state.pin.slice(0, -1);
    else { if(k !== "ok" && state.pin.length < 8) state.pin += k;
      const need = branchOf(state.branch).code.length;
      if(k === "ok" || state.pin.length >= need){ const ok = state.pin === branchOf(state.branch).code; state.pin = ""; if(ok) state.unlocked = true; else state.err = "공용 코드가 맞지 않아요."; } }
    render();
  });
}
function bindBook(){
  /* 숨겨진 입구: 페이지 머리줄을 1.5초 길게 누르면 설정 */
  book.querySelectorAll(".run").forEach(el => {
    let t; const clear = () => clearTimeout(t);
    el.addEventListener("pointerdown", () => { t = setTimeout(() => { state.view = "account"; state.unlocked = false; state.pin = ""; render(); }, 1500); });
    ["pointerup","pointerleave","pointercancel"].forEach(e => el.addEventListener(e, clear));
  });
}
render();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawAll, 150); });
document.fonts && document.fonts.ready.then(drawAll);
</script>
